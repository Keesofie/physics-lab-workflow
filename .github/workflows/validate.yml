name: Validate skill and PDF renderer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install Chinese font
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Validate portable structure
        run: python tests/validate_structure.py
      - name: Test PDF rendering
        run: python tests/test_renderer.py
